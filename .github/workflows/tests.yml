name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev,claude]"

      - name: Lint (ruff)
        run: uv run ruff check aipaf tests

      # I test non richiedono ANTHROPIC_API_KEY ne' Ollama:
      # provider mock e HashEmbeddingFunction (vedi README, "Eseguire i test").
      - name: Test
        run: uv run pytest tests/ -v --cov=aipaf --cov-report=term-missing

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: uv build

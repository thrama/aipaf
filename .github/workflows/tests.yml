name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,claude]"

      # I test non richiedono ANTHROPIC_API_KEY ne' Ollama:
      # provider mock e HashEmbeddingFunction (vedi README, "Eseguire i test").
      - name: Test
        run: python -m pytest tests/ -v --cov=aipaf --cov-report=term-missing

      - name: Lint (ruff)
        # Non bloccante finche' il backlog di lint non e' azzerato.
        continue-on-error: true
        run: ruff check aipaf tests

      - name: Build wheel
        if: matrix.python-version == '3.12'
        run: |
          pip install build
          python -m build
